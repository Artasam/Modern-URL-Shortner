<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad1" x1="120" y1="120" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="192" y1="192" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g filter="url(#glow)">
    <rect x="120" y="200" width="160" height="96" rx="48" fill="none" stroke="url(#grad1)" stroke-width="32" transform="rotate(-45 200 248)"/>
    <rect x="232" y="200" width="160" height="96" rx="48" fill="none" stroke="url(#grad2)" stroke-width="32" transform="rotate(-45 312 248)"/>
  </g>
</svg>
